name: Deploy ADF to QA

on:
  push:
    branches:
      - adf_publish

jobs:
  deploy-to-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Stop QA Triggers
        run: |
          az datafactory trigger list \
            --resource-group RG-QA \
            --factory-name adf-qa \
            --query "[].name" -o tsv | \
          xargs -I {} az datafactory trigger stop \
            --resource-group RG-QA \
            --factory-name adf-qa \
            --name {}

      - name: Deploy ARM Template to QA
        uses: azure/arm-deploy@v1
        with:
          resourceGroupName: RG-QA
          template: ./ARMTemplateForFactory.json
          parameters: ./ARMTemplateParametersForFactory.json

      - name: Start QA Triggers
        run: |
          az datafactory trigger list \
            --resource-group RG-QA \
            --factory-name adf-qa \
            --query "[].name" -o tsv | \
          xargs -I {} az datafactory trigger start \
            --resource-group RG-QA \
            --factory-name adf-qa \
            --name {}
